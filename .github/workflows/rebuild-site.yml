name: Rebuild site

# Asks GitHub Pages to rebuild the site from its branch. Pages normally does
# this on every push, but now and then it misses one; this is the button for
# those times. Started by hand only.
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a Pages build
        run: |
          CODE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "%{http_code}")
          echo "Pages build requested: HTTP $CODE"
          test "$CODE" -lt 300
