name: Telegram uploader

# Publishes a photo sent to Telegram onto the site.
#
# This is the slow half of the bot. The fast half is a Cloudflare Worker
# (bot/worker/worker.js) that is always awake: it answers the message in
# under a second and then starts this, which does the resizing, editing,
# committing and pushing that a Worker cannot.
#
# The repository is public, so the minutes this uses are free.
#
# To switch it off, delete this file or disable it from the Actions tab, and
# remove the Telegram webhook. See bot/README.md.
on:
  # The Cloudflare Worker fires this the moment a message arrives, carrying
  # the message with it — that is what makes the bot answer in seconds
  # instead of whenever GitHub next feels like running a schedule.
  repository_dispatch:
    types: [telegram]
  workflow_dispatch:
  # A slow safety net. It cannot fetch anything while the webhook is live
  # (Telegram allows a webhook or polling, never both) and says so rather
  # than failing; it earns its keep only if the Worker is ever removed.
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write   # commit and push the new piece
  pages: write      # ask Pages to rebuild afterwards
  actions: write    # let /film start the render workflow

# Two runs at once would process the same photos twice.
concurrency:
  group: telegram-uploader
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/website-mobile-redesign-xfmicu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet httpx==0.28.1 Pillow==11.1.0

      - name: Check Telegram
        working-directory: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          GIT_BRANCH: claude/website-mobile-redesign-xfmicu
          SITE_URL: https://sanu0910.github.io/Crochet_Mayuri/
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit-msg.txt
          ANNOUNCE_FILE: ${{ runner.temp }}/announce.json
          # Empty unless this run was started by the Worker.
          PUSHED_UPDATE: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.update) || '' }}
        run: python poll_once.py

      - name: Publish anything new
        id: publish
        env:
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit-msg.txt
        run: |
          if [ ! -f "$COMMIT_MSG_FILE" ]; then
            echo "Nothing new."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Mayuri'z bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "A message arrived but changed nothing."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --file "$COMMIT_MSG_FILE"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ask Pages to rebuild
        id: pages
        # A push made with GITHUB_TOKEN does not set off other workflows, so
        # the Pages build has to be requested by hand or the upload would sit
        # in the branch without ever going live.
        if: steps.publish.outputs.published == 'true'
        run: |
          CODE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "%{http_code}")
          echo "Pages build requested: HTTP $CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Say so in Telegram
        # poll_once.py runs before the commit exists, so it can only promise.
        # This closes the loop on the same message with what actually landed.
        if: steps.publish.outputs.published == 'true'
        working-directory: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SITE_URL: https://sanu0910.github.io/Crochet_Mayuri/
          ANNOUNCE_FILE: ${{ runner.temp }}/announce.json
          COMMIT_SHA: ${{ steps.publish.outputs.sha }}
          PAGES_STATUS: ${{ steps.pages.outputs.code }}
        run: python announce.py
